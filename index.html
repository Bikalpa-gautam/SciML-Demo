<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concrete Defect Recognition</title>
  <meta name="description" content="Recognise crack, rust and spalling in photos of concrete with two neural networks, directly in the browser.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="wrap top">
    <h1>Concrete Defect Recognition</h1>
    <p>Bikalpa Gautam</p>
  </header>

  <main class="wrap">
    <nav class="tabs" role="tablist" aria-label="Task">
      <button type="button" role="tab" data-mode="real" aria-selected="true">Trained on real photos</button>
      <button type="button" role="tab" data-mode="synthetic" aria-selected="false">Trained on synthetic images</button>
    </nav>

    <section class="pick">
      <label class="upload" id="drop">
        <input id="file" type="file" accept="image/*" hidden>
        <span class="button">Upload photo</span>
        <span>or drop / paste an image</span>
      </label>
      <div id="examples" class="examples" aria-label="Examples"></div>
    </section>

    <section id="result" class="result" hidden aria-live="polite">
      <figure>
        <img id="photo" alt="Selected photo">
        <figcaption id="truth" hidden></figcaption>
      </figure>
      <div id="cards" class="cards"></div>
    </section>

    <p id="status" class="status" role="status">Loading …</p>
  </main>

  <footer class="wrap foot">
    Example photos: dacl10k (Flotzinger et al., WACV 2024), CC BY-NC 4.0.
  </footer>

  <script src="ort/ort.wasm.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
